name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release version
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.1.0-alpha.1"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            squashfs-tools \
            file

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build CLI binary
        run: cargo build --release -p mdm-cli

      - name: Build Tauri Desktop bundles (.deb & .AppImage)
        run: |
          cd mdm-app
          tauri build --bundles deb,appimage

      - name: Prepare Linux release assets
        run: |
          mkdir -p artifacts/linux
          VERSION="${{ steps.vars.outputs.version }}"

          # 1. Package standalone CLI binary
          cp target/release/mdm artifacts/linux/mdm
          tar -czvf "artifacts/linux/mdm-${VERSION}-linux-x86_64.tar.gz" -C target/release mdm
          rm artifacts/linux/mdm

          # 2. Package standalone Desktop binary
          tar -czvf "artifacts/linux/mdm-app-${VERSION}-linux-x86_64.tar.gz" -C target/release mdm-app

          # 3. Copy .deb package
          find target/release/bundle/deb -name "*.deb" -exec cp {} artifacts/linux/ \;

          # 4. Copy .AppImage package
          find target/release/bundle/appimage -name "*.AppImage" -exec cp {} artifacts/linux/ \;

          ls -lah artifacts/linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: artifacts/linux/*
          if-no-files-found: error

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release version
        id: vars
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.1.0-alpha.1"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Compile release binaries (CLI & App)
        shell: pwsh
        run: |
          cargo build --release -p mdm-cli -p mdm-app

      - name: Run Windows Packaging Script
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -SkipBuild

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $ver = "${{ steps.vars.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null

          # Copy NSIS installer and Portable ZIP from dist
          Get-ChildItem -Path dist -Filter "*.exe" | Copy-Item -Destination artifacts/windows/ -Force
          Get-ChildItem -Path dist -Filter "*.zip" | Copy-Item -Destination artifacts/windows/ -Force

          # Package standalone Windows CLI
          Compress-Archive -Path target\release\mdm.exe -DestinationPath "artifacts/windows/mdm-cli-${ver}-windows-x64.zip" -Force

          # Package Browser Extension
          Compress-Archive -Path extension\* -DestinationPath "artifacts/windows/mdm-browser-extension.zip" -Force

          Get-ChildItem -Path artifacts/windows/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: artifacts/windows/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-assets

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA-256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Determine Prerelease Status
        id: pre
        run: |
          IS_PRE="false"
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]] || \
             [[ "${{ github.ref_name }}" =~ alpha|beta|rc|preview ]]; then
            IS_PRE="true"
          fi
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ steps.pre.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          name: ${{ github.ref_name }}
