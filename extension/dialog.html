<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mDm — Download File Info</title>
  <link rel="stylesheet" href="dialog.css">
</head>
<body>
  <div class="dlg-window">
    <!-- Header -->
    <header class="dlg-head">
      <div class="dlg-title">
        <svg class="dlg-mascot" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <radialGradient id="g-dlg-mascot" cx="0.5" cy="0.5" r="0.75">
              <stop offset="0" stop-color="#f2a95c"/>
              <stop offset="1" stop-color="#c96a2e"/>
            </radialGradient>
          </defs>
          <circle cx="60" cy="62" r="44" fill="url(#g-dlg-mascot)"/>
          <circle cx="46" cy="44" r="6.5" fill="#141820"/>
          <circle cx="74" cy="44" r="6.5" fill="#141820"/>
          <circle cx="48" cy="42" r="2" fill="#fff"/>
          <circle cx="76" cy="42" r="2" fill="#fff"/>
          <path d="M47 57 Q60 66 73 57" stroke="#141820" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <rect x="54.5" y="70" width="11" height="16" rx="5.5" fill="#141820"/>
          <path d="M42 80 h36 L60 97 Z" fill="#141820"/>
        </svg>
        <span class="dlg-app-name">mDm</span>
        <span class="dlg-divider">|</span>
        <span class="dlg-header-label">Download File Info</span>
      </div>
      <button type="button" class="dlg-btn-close" id="btn-close" title="Close" aria-label="Close dialog">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>

    <!-- Form Content -->
    <main class="dlg-body">
      <!-- File Summary Card -->
      <div class="dlg-file-card">
        <div class="dlg-file-icon-box" id="dlg-file-icon" title="Detected File Type">
          <!-- Dynamically populated with category SVG icon -->
        </div>
        <div class="dlg-file-meta">
          <div class="dlg-file-label-row">
            <label for="dlg-filename" class="dlg-meta-title">Save As:</label>
            <span class="dlg-ext-badge" id="dlg-ext-badge">FILE</span>
          </div>
          <input type="text" id="dlg-filename" class="dlg-input dlg-filename-input" spellcheck="false" autocomplete="off" placeholder="Filename...">
        </div>
      </div>

      <!-- URL Row -->
      <div class="dlg-row">
        <label for="dlg-url" class="dlg-label">
          <svg class="dlg-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span>URL:</span>
        </label>
        <div class="dlg-field-wrap dlg-has-button">
          <input type="text" id="dlg-url" class="dlg-input dlg-readonly" readonly spellcheck="false" placeholder="Download target URL...">
          <button type="button" class="dlg-field-btn" id="btn-copy-url" title="Copy URL to clipboard">
            <svg class="btn-copy-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span class="dlg-copy-text" id="dlg-copy-text">Copy</span>
          </button>
        </div>
      </div>

      <!-- Category & Size Grid -->
      <div class="dlg-row">
        <label for="dlg-category" class="dlg-label">
          <svg class="dlg-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Category:</span>
        </label>
        <div class="dlg-field-wrap dlg-grid-cat-size">
          <select id="dlg-category" class="dlg-select">
            <option value="general">General</option>
            <option value="programs">Programs (.exe, .msi, .apk, .iso)</option>
            <option value="compressed">Compressed (.zip, .rar, .7z, .tar)</option>
            <option value="videos">Videos (.mp4, .mkv, .webm, .mov)</option>
            <option value="audio">Audio (.mp3, .flac, .wav, .m4a)</option>
            <option value="documents">Documents (.pdf, .docx, .txt)</option>
          </select>
          <div class="dlg-size-badge" id="dlg-size-badge">
            <span class="dlg-size-dot" id="dlg-size-dot"></span>
            <span id="dlg-size">Size: Probing…</span>
          </div>
        </div>
      </div>

      <!-- Save To Folder Row -->
      <div class="dlg-row">
        <label for="dlg-output-dir" class="dlg-label">
          <svg class="dlg-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"/>
          </svg>
          <span>Save To:</span>
        </label>
        <div class="dlg-field-wrap">
          <input type="text" id="dlg-output-dir" class="dlg-input" spellcheck="false" placeholder="Destination directory...">
        </div>
      </div>

      <!-- Options Row -->
      <div class="dlg-options-row">
        <label class="dlg-checkbox-label">
          <input type="checkbox" id="dlg-chk-show" checked>
          <span>Always show this dialog before starting downloads</span>
        </label>
      </div>
    </main>

    <!-- Footer -->
    <footer class="dlg-footer">
      <div class="dlg-footer-left">
        <div class="dlg-status-indicator" id="dlg-status">
          <span class="dlg-status-dot is-connecting" id="dlg-status-dot"></span>
          <span class="dlg-status-label" id="dlg-status-text">Connecting to mDm…</span>
        </div>
      </div>
      <div class="dlg-buttons">
        <button type="button" id="btn-later" class="dlg-btn-secondary" title="Add to queue in paused state">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>Download Later</span>
        </button>
        <button type="button" id="btn-cancel" class="dlg-btn-secondary" title="Cancel this download">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          <span>Cancel</span>
        </button>
        <button type="button" id="btn-start" class="dlg-btn-primary" title="Start downloading immediately">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v13"/>
            <polyline points="7 11 12 16 17 11"/>
            <line x1="5" y1="21" x2="19" y2="21"/>
          </svg>
          <span>Start Download</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="dialog.js"></script>
</body>
</html>
